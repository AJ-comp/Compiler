<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
<title id="title">현재 커서를 보관하는 위치</title>
<desc id="desc">이번 parser.Parsing(source) 호출에서 만든 ContextualInput이 Cursor를 보관한다. 시작할 때 source.Start로 초기화하고 두 토큰 소비 후 현재 Cursor는 원문 위치8을 가리킨다. source.Start는 시작 위치0을 유지한다.</desc>
<rect width="1000" height="860" fill="#FFFFFF"/>
<text x="60" y="57" fill="#526078" font-family="'Cascadia Mono',Consolas,monospace" font-size="23" font-weight="500" text-anchor="start">02  /  ContextualInput</text>
<text x="60" y="120" fill="#172235" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="40" font-weight="750" text-anchor="start">파서는 현재 커서를 따로 보관합니다.</text>
<text x="60" y="167" fill="#526078" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="400" text-anchor="start">파싱 호출마다 만든 ContextualInput의 Cursor에 보관합니다.</text>
