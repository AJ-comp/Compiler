<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="825" viewBox="0 0 1000 825" role="img" aria-labelledby="title desc">
<title id="title">Peek로 받은 토큰과 Next</title>
<desc id="desc">현재 커서8에서 Peek를 요청하면 source는9부터13까지의 /ab/g 토큰과 SourceOffset14인 Next를 반환한다. 실제 파서의 현재 Cursor.SourceOffset은 여전히8이다.</desc>
<rect width="1000" height="825" fill="#FFFFFF"/>
<text x="60" y="57" fill="#526078" font-family="'Cascadia Mono',Consolas,monospace" font-size="23" font-weight="500" text-anchor="start">03  /  TokenRead</text>
<text x="60" y="120" fill="#172235" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="40" font-weight="750" text-anchor="start">Peek는 토큰과 Next를 반환합니다.</text>
<text x="60" y="167" fill="#526078" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="400" text-anchor="start">현재 Cursor는 8에 남고, 반환된 Next는 14를 가리킵니다.</text>
