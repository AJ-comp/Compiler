<polyline points="532,1125 532,1192" stroke="#6D42C2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="526,1128 538,1128 532,1138" fill="#6D42C2"/>
<polyline points="844,1125 844,1192" stroke="#2166B0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="838,1128 850,1128 844,1138" fill="#2166B0"/>
<text x="60" y="1261" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" font-weight="650" text-anchor="start" fill="#6D42C2">Peek 직후 파서의 현재 커서는 8입니다.</text>
<text x="60" y="1305" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#526078">파서가 /ab/g를 Shift할 때 Next(14)로 이동합니다.</text>
</svg>
