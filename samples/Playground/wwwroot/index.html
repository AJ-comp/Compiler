<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janglim Playground · Explore your grammar</title>
    <meta name="description" content="An interactive EBNF and LALR parser playground. Visualize syntax trees and explore every parsing decision with Janglim." />
    <meta name="keywords" content="Janglim, parser, parser generator, LALR, EBNF, grammar, lexer, syntax tree, parsing table, compiler, playground, WebAssembly" />
    <link rel="canonical" href="https://janglim.mythosia.net/" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="ui/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Janglim.Playground.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading" role="status"><div class="loading-mark"></div><strong>Janglim</strong><span data-bootstrap-i18n="Preparing your grammar workspace…">Preparing your grammar workspace…</span></div>
    </div>

    <div id="blazor-error-ui">
        <span data-bootstrap-i18n="An unhandled error has occurred.">An unhandled error has occurred.</span>
        <a href="." class="reload" data-bootstrap-i18n="Reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="ui/locale.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="js/monaco-locale.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="js/ebnf-language.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
