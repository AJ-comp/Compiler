name: Release Janglim

# Keep this file name: the existing NuGet Trusted Publishing policy trusts it.
# Every master push validates both products, publishes a new engine version,
# then deploys the web artifact produced by that same validation run.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and save artifacts without publishing or deploying'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: janglim-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    uses: ./.github/workflows/verify-release.yml

  publish:
    name: Publish engine to NuGet
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.package_artifact }}
          path: artifacts

      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt

      - name: Check whether nuget.org already has this version
        id: check
        run: python3 .github/scripts/check-nuget-version.py Janglim "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (Trusted Publishing)
        if: steps.check.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: JJW

      - name: Push the verified package to nuget.org
        if: steps.check.outputs.exists == 'false'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/Janglim.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Record NuGet result
        env:
          VERSION_EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          if [ "$VERSION_EXISTS" = 'true' ]; then
            echo "Janglim $PACKAGE_VERSION is already on NuGet; publication skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Janglim $PACKAGE_VERSION was published to NuGet." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy playground
    needs: [verify, publish]
    if: ${{ github.ref == 'refs/heads/master' && needs.verify.outputs.frontend_enabled == 'true' && (github.event_name == 'push' || inputs.dry_run == false) }}
    uses: ./.github/workflows/deploy-playground.yml
    with:
      artifact_name: ${{ needs.verify.outputs.web_artifact }}
      web_version: ${{ needs.verify.outputs.web_version }}
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

  summary:
    name: Release result
    if: always()
    needs: [verify, publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.verify.result }}
      NUGET_RESULT: ${{ needs.publish.result }}
      WEB_RESULT: ${{ needs.deploy.result }}
      PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
      WEB_VERSION: ${{ needs.verify.outputs.web_version }}
      RELEASE_REF: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
      DRY_RUN: ${{ inputs.dry_run }}
      FRONTEND_ENABLED: ${{ needs.verify.outputs.frontend_enabled }}
    steps:
      - name: Summarize verification and destinations
        run: |
          {
            echo '## Release result'
            echo "Ref: $RELEASE_REF"
            echo ''
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Test and build | $BUILD_RESULT |"
            echo "| NuGet $PACKAGE_VERSION | $NUGET_RESULT |"
            echo "| Playground $WEB_VERSION | $WEB_RESULT |"
            if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$DRY_RUN" = 'true' ]; then
              echo ''
              echo 'Dry run: no package publication or production deployment.'
            elif [ "$RELEASE_REF" != 'master' ]; then
              echo ''
              echo 'This ref only validates artifacts; production releases require master.'
            elif [ "$BUILD_RESULT" = 'success' ] && [ "$FRONTEND_ENABLED" != 'true' ]; then
              echo ''
              echo 'Legacy checkout: the production website is preserved until the React frontend is committed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
