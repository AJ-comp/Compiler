name: Deploy verified playground

# Called after successful verification and NuGet publication (or duplicate skip).
# No independent push trigger: the release workflow controls ordering.
on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Verified static-site artifact from this workflow run'
        required: true
        type: string
      web_version:
        description: 'Version of the verified web application'
        required: true
        type: string
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy verified static files
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the current master commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          latest_sha=$(gh api "repos/${RELEASE_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$latest_sha" ]; then
            echo '::error::This commit is no longer the master head. Run the release workflow on current master instead.'
            exit 1
          fi

      - name: Download the verified playground
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: publish/wwwroot

      - name: Check deployment inputs
        env:
          SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          test -n "$SWA_DEPLOY_TOKEN" || { echo 'Azure deployment token is not configured.' >&2; exit 1; }
          test -f publish/wwwroot/index.html
          test -d publish/wwwroot/_framework

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Record deployment result
        env:
          WEB_VERSION: ${{ inputs.web_version }}
        run: echo "Playground $WEB_VERSION deployed to https://janglim.mythosia.net/." >> "$GITHUB_STEP_SUMMARY"
